<header class="topbar"><div class="brand"><span class="brand-mark">RP</span><span>Recruitment & Placement<br><small class="muted">Management System</small></span></div><div class="user">Recruiter · Demo User &nbsp; | &nbsp; <a href="login.html">Logout</a></div></header>
<div class="layout"><nav class="sidebar"><a class="" href="dashboard.html">Dashboard</a><a class="" href="candidates.html">Candidates</a><a class="" href="companies.html">Companies</a><a class="" href="jobs.html">Jobs</a><a class="" href="applications.html">Applications</a><a class="" href="interviews.html">Interviews</a><a class="" href="placement-process.html">Placement Process</a><a class="" href="reports.html">Reports</a><a href="login.html">Logout</a></nav><main class="main"><div class="page-title"><div><h1>Create / Edit Job</h1><div class="crumb">Home / Create / Edit Job</div></div></div>
<section class="panel"><h2>Basic Information</h2><form onsubmit="event.preventDefault(); alert('Prototype only: job is not saved.');"><div class="form-grid"><label>Company *<select required><option>Infosys</option><option>TechNova</option><option>CloudWorks</option></select></label><label>Job Code *<input required placeholder="JOB-2026-004"></label><label>Job Title *<input required placeholder="Associate Java Developer"></label><label>Number of Openings *<input type="number" min="1" required></label><label>Employment Type<select><option>Full-time</option><option>Internship</option><option>Contract</option></select></label><label>Location *<input required placeholder="Pune"></label><label>Minimum Package (LPA)<input type="number" min="0" step=".1"></label><label>Maximum Package (LPA)<input type="number" min="0" step=".1"></label><label>Qualification *<input required placeholder="BE, BTech, MCA"></label><label>Minimum Percentage *<input type="number" min="0" max="100" required></label><label>Minimum Passing Year<input type="number" min="2000" max="2035"></label><label>Maximum Passing Year<input type="number" min="2000" max="2035"></label><label>Maximum Backlogs *<input type="number" min="0" value="0" required></label><label>Required Technology *<select><option>Java</option><option>Python</option><option>Testing</option><option>Data Analytics</option></select></label><label>Required Skills *<input required placeholder="SQL, OOP, JDBC"></label><label>Posted Date *<input type="date" required></label><label>Application Deadline *<input type="date" required></label><label>Status<select><option>OPEN</option><option>DRAFT</option><option>CLOSED</option></select></label></div><div class="actions"><button class="btn">Save Job</button><button class="btn secondary" type="reset">Reset</button><a class="btn secondary" href="jobs.html">Cancel</a></div></form></section>
</main></div><script src="js/app.js"></script></body></html>
